name: CI

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

jobs:
  test:
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        python-version: ["3.9", "3.10", "3.11", "3.12", "3.13"]
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}
      - run: python -m pip install --upgrade pip
      - run: pip install -e '.[test]'
      - run: pytest
      - name: CLI smoke test
        run: |
          redact-transcripts --version
          redact-transcripts examples/session.jsonl --report > /dev/null
          if redact-transcripts --check examples/session.jsonl; then echo "expected findings"; exit 1; fi

  lint:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: pip install 'ruff>=0.16,<0.17' 'reuse[charset-normalizer]>=4'
      - run: ruff check .
      - run: ruff format --check .
      - run: reuse lint

  secrets:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: gitleaks (synthetic vectors allowlisted in .gitleaks.toml)
        run: |
          curl -sSfL https://github.com/gitleaks/gitleaks/releases/download/v8.28.0/gitleaks_8.28.0_linux_x64.tar.gz \
            | tar -xz gitleaks
          ./gitleaks dir . --config .gitleaks.toml --redact --no-banner
