name: Bug report
description: Wrong output, a false positive, a crash, or broken structure
labels: [bug]
body:
  - type: markdown
    attributes:
      value: "Use synthetic input only. Never paste real secrets or real transcripts."
  - type: textarea
    id: repro
    attributes:
      label: Minimal input, command and output
      render: console
    validations:
      required: true
  - type: textarea
    id: expected
    attributes:
      label: What you expected
    validations:
      required: true
  - type: input
    id: version
    attributes:
      label: Version (redact-transcripts --version) and Python version
    validations:
      required: true
