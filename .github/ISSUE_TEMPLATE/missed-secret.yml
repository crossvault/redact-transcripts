name: Missed secret shape
description: A token or credential format that is not redacted (not covered by a documented rule)
labels: [rule-request]
body:
  - type: markdown
    attributes:
      value: "**Do not paste a real secret, not even a revoked one.** Give a synthetic sample of the same shape and mark it FAKE."
  - type: input
    id: vendor
    attributes:
      label: Vendor / system
      placeholder: e.g. Example Cloud API key
    validations:
      required: true
  - type: textarea
    id: sample
    attributes:
      label: Synthetic sample and format description
      description: Prefix, length, alphabet, and a link to the vendor's documentation of the format if public.
      placeholder: "excl_FAKE0000000000000000000000 (prefix excl_, 26 base62 characters)"
    validations:
      required: true
  - type: checkboxes
    id: confirm
    attributes:
      label: Confirmation
      options:
        - label: The sample above is synthetic and is not a real or revoked credential.
          required: true
